[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-vqa-with-llava"
version = "0.1.0"
description = "A vision-language model for multiple-choice question answering over images"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "torch>=2.0",
]

[project.optional-dependencies]
models = [
    "transformers>=4.50",
    "peft>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
